[project]
name = "support-agent"
version = "0.1.0"
description = "Sample customer support agent demonstrating StuntDouble"
requires-python = ">=3.12,<3.14"
license = "MIT"

dependencies = [
    "stuntdouble",
    "langchain-core>=1.2.5",
    "langgraph>=1.0.0",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio"]

[tool.uv.sources]
stuntdouble = { git = "https://github.com/intuit/stunt-double", rev = "b6e38072fa03654fa359b075bd366d0bf70931ba" } # pragma: allowlist secret

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/support_agent"]

[tool.basedpyright]
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"


